# Builds the app and runs its tests on Apple Silicon, on macOS 15 and macOS 26, with the
# Xcode each image has (the release is built with Xcode 26.5):
#   - the unit tests that need no database server (the database suites need the Docker
#     containers that scripts/run-all-tests.sh provisions; run them locally with it);
#   - the UI tests, which click the workspace's tab strips and + buttons, and walk the
#     everyday flows on a MariaDB the job installs (MySQLWorkflowUITests).
# And it starts the app on macOS 14, the oldest it supports. Xcode 26, which the app
# needs, doesn't run on macOS 14, so the app is built on macOS 15 and only launched
# there (scripts/launch-smoke.sh): it starts, shows its window, and stays up.
# And the App Store build: sandboxed and without Sparkle (scripts/test-appstore-build.sh),
# its own SSH and SQLite code run in the sandbox (scripts/check-appstore-sandbox.sh --ci).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # build-duckdb.yml, on the DuckDB package it has just built (before it is published).
  workflow_call:
    inputs:
      duckdb-artifact:
        type: string
        default: ""

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            xcode: /Applications/Xcode_26.5.app
          - os: macos-15
            xcode: /Applications/Xcode_26.3.app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: ${{ matrix.xcode }}/Contents/Developer
      SIGNING: CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
    steps:
      - uses: actions/checkout@v4

      - name: The DuckDB package this run built
        if: inputs.duckdb-artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.duckdb-artifact }}
          path: duckdb-package

      - name: Fetch DuckDB's static libraries
        run: |
          zip=$(ls "$PWD"/duckdb-package/*.zip 2>/dev/null | head -1)
          SB_DUCKDB_ZIP="$zip" ./scripts/fetch-duckdb.sh

      - name: Acknowledgements list the package's licenses
        run: python3 scripts/acknowledgements.py --check

      - name: Unit tests
        run: |
          set +e
          xcodebuild test -scheme SequelBridge -destination 'platform=macOS,arch=arm64' \
            -parallel-testing-enabled NO $SIGNING > unit.log 2>&1
          status=$?
          grep -E "Test run with|✘|error:|\*\* (TEST|BUILD)" unit.log
          exit $status

      - name: MariaDB for the UI tests
        if: always()
        run: |
          # The everyday flows (MySQLWorkflowUITests) run against a real server, seeded
          # with the fixtures the local suites use. The runner's user logs in by socket.
          brew install mariadb >/dev/null
          brew services start mariadb
          for i in $(seq 1 60); do mariadb -e 'SELECT 1' >/dev/null 2>&1 && break; sleep 1; done
          mariadb -e "CREATE USER IF NOT EXISTS 'sbui'@'%' IDENTIFIED BY 'sbui-pass';
                      CREATE USER IF NOT EXISTS 'sbui'@'localhost' IDENTIFIED BY 'sbui-pass';
                      GRANT ALL PRIVILEGES ON *.* TO 'sbui'@'%'; GRANT ALL PRIVILEGES ON *.* TO 'sbui'@'localhost';"
          mariadb < scripts/fixtures/mysql.sql
          mariadb -e "SELECT VERSION(); SELECT COUNT(*) FROM sbtest.orders"

      - name: UI tests
        if: always()
        env:
          TEST_RUNNER_SB_UI_MYSQL_HOST: 127.0.0.1
          TEST_RUNNER_SB_UI_MYSQL_PORT: "3306"
          TEST_RUNNER_SB_UI_MYSQL_USER: sbui
          TEST_RUNNER_SB_UI_MYSQL_PASS: sbui-pass
        run: |
          set +e
          xcodebuild test -scheme SequelBridgeUITests -destination 'platform=macOS,arch=arm64' \
            -parallel-testing-enabled NO -resultBundlePath ui.xcresult $SIGNING > ui.log 2>&1
          status=$?
          grep -E "Test Case .*(passed|failed)|error:|\*\* (TEST|BUILD)" ui.log
          exit $status

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: |
            unit.log
            ui.log
            ui.xcresult

  app-store:
    name: App Store build, sandboxed
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: The DuckDB package this run built
        if: inputs.duckdb-artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.duckdb-artifact }}
          path: duckdb-package

      - name: Fetch DuckDB's static libraries
        run: |
          zip=$(ls "$PWD"/duckdb-package/*.zip 2>/dev/null | head -1)
          SB_DUCKDB_ZIP="$zip" ./scripts/fetch-duckdb.sh

      - name: The App Store build (sandboxed, no Sparkle)
        run: scripts/test-appstore-build.sh

      - name: The sandbox check
        run: scripts/check-appstore-sandbox.sh --ci

  build-for-macos-14:
    name: Build for macOS 14
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      SIGNING: CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
    steps:
      - uses: actions/checkout@v4

      - name: The DuckDB package this run built
        if: inputs.duckdb-artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.duckdb-artifact }}
          path: duckdb-package

      - name: Fetch DuckDB's static libraries
        run: |
          zip=$(ls "$PWD"/duckdb-package/*.zip 2>/dev/null | head -1)
          SB_DUCKDB_ZIP="$zip" ./scripts/fetch-duckdb.sh

      - name: Build the app (Release)
        run: |
          set +e
          xcodebuild build -scheme SequelBridge -configuration Release -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath dd $SIGNING > build.log 2>&1
          status=$?
          grep -E "error:|\*\* BUILD" build.log
          [ $status -eq 0 ] || exit $status
          ditto -c -k --keepParent dd/Build/Products/Release/SequelBridge.app SequelBridge.zip

      - uses: actions/upload-artifact@v4
        with:
          name: app-for-macos-14
          path: SequelBridge.zip

  starts-on-macos-14:
    name: Starts on macOS 14
    needs: build-for-macos-14
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-for-macos-14

      - name: Start the app
        run: |
          ditto -x -k SequelBridge.zip .
          ./scripts/launch-smoke.sh "$PWD/SequelBridge.app"
